  <script>
    // Applied before Angular boots so a returning visitor never sees a flash of
    // the wrong theme, or the layout jumping from LTR to RTL.
    (function () {
      try {
        var t = localStorage.getItem('mk-theme') || 'dark';
        document.documentElement.classList.toggle('dark', t === 'dark');
        var l = localStorage.getItem('mk-lang') || 'en';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
